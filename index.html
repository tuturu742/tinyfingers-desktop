<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TinyFingers</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        cursor: crosshair;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: #222;
        opacity: 0.6;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hint">type the password to exit</div>
    <script src="renderer.js"></script>
  </body>
</html>
